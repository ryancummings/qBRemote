name: Bug report
description: Report a reproducible problem in the app
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, private server addresses, or torrent names.
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS or iPadOS version
    validations:
      required: true
  - type: input
    id: qbittorrent-version
    attributes:
      label: qBittorrent version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that cause the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: More details
      description: If a screenshot or log helps, remove private details before attaching it.
